---

<h2>Colors</h2>

<p>All colors are defined as css varaiables</p>
<prolit-scope debug>
  <template>
    <script type="application/json" scope>
      {
        "colors": ["primary", "secondary", "success", "info", "warning", "danger", "light", "dark"]
      }
    </script>

    <div class="row g-1">
      <div
        *for="color of colors"
        class="col-6 color-brick"

      >
        <div class="header" style="background-color: var(--nt-{{color}}); color: var(--nt-text-on-{{color}})">
          <code>background-color: --nt-{{color}}<br />color: --nt-text-on-{{color}}</code>
        </div>
        <div class="sub" style="background-color: var(--nt-{{color}}-subtle); color: var(--nt-dark)">
          --nt-{{color}}-subtle
        </div>
        <div class="sub" style="background-color: var(--nt-white); color: var(--nt-{{color}}-emphasis)">
          --nt-{{color}}-emphasis
        </div>
      </div>

      <div class="color-brick" >
        <div class="header" style="background-color: var(--nt-black); color: var(--nt-text-on-black)">
          <code>background-color: --nt-black<br />color: --nt-text-on-black</code>
        </div>
      </div>
      <div class="color-brick" >
        <div class="header" style="background-color: var(--nt-white); color: var(--nt-text-on-white)">
          <code>background-color: --nt-white<br />color: --nt-text-on-white</code>
        </div>
      </div>

      <div class="color-brick" >
        <div class="header" style="background-color: var(--nt-dark); color: var(--nt-text-on-dark)">
          <code>background-color: --nt-dark<br />color: --nt-text-on-dark</code>
        </div>
        <div class="sub" style="background-color: var(--nt-dark-subtle); color: var(--nt-light)">--nt-dark-subtle</div>
        <div class="sub" style="background-color: var(--nt-body-secondary); color: var(--nt-dark)">--nt-body-secondary</div>
        <div class="sub" style="background-color: var(--nt-body-tertiary); color: var(--nt-dark)">--nt-body-tertiary</div>
        <div class="sub" style="background-color: var(--nt-body); color: var(--nt-dark)">--nt-body</div>
      </div>
    </div>
  </template>
</prolit-scope>
